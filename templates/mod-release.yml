# Copy to .github/workflows/release.yml in a Fabric mod repo.
# Push a tag like v0.1.0 -> builds with Gradle -> GitHub release with the mod jar,
# which `python pipeline/pack.py add github <owner/repo>` (or `update`) picks up.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -vE -- '-(sources|javadoc|dev)\.jar$')
          gh release create "$GITHUB_REF_NAME" $jar --title "$GITHUB_REF_NAME" --generate-notes
